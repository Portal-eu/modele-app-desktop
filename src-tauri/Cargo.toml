[package]
name = "modele-app-desktop"
version = "0.1.0"
description = "Dépôt modèle des apps desktop de Portal"
authors = ["Portal ICT"]
license = "AGPL-3.0-only"
repository = "https://github.com/Portal-eu/modele-app-desktop"
edition = "2021"
rust-version = "1.100"
publish = false

[lib]
name = "modele_app_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }
rayon = "=1.12.0"
log = "=0.4.35"
env_logger = "=0.11.11"
chrono = { version = "=0.4.45", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
