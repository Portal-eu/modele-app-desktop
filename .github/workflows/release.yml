# Sur un tag vX.Y.Z : contrôle de la version, build des deux .exe portables
# (Windows x64 et ARM64) et publication de la Release GitHub, sans geste manuel.
# Seul GITHUB_TOKEN est utilisé.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Contrôle de la version
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.lire.outputs.app }}
      version: ${{ steps.lire.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Version identique au tag
        run: node scripts/verifier-version.mjs "$GITHUB_REF_NAME"

      - name: Nom et version de l'app
        id: lire
        run: |
          echo "app=$(node -p 'require("./package.json").name')" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      EXE: ${{ needs.version.outputs.app }}-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}.exe
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Dépendances npm (package-lock.json)
        run: npm ci

      # --no-bundle : un seul .exe portable, sans installeur.
      - name: Build de l'exécutable portable
        run: npx tauri build --ci --no-bundle --target ${{ matrix.target }} -- --locked

      - name: Renommage
        run: |
          cp "src-tauri/target/${{ matrix.target }}/release/${{ needs.version.outputs.app }}.exe" "$EXE"
          ls -l "$EXE"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.arch }}
          path: ${{ env.EXE }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publication de la Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: exe
          merge-multiple: true

      - name: Release GitHub (Latest)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l exe
          gh release create "$GITHUB_REF_NAME" exe/*.exe \
            --verify-tag \
            --latest \
            --title "${{ needs.version.outputs.app }} $GITHUB_REF_NAME" \
            --generate-notes
