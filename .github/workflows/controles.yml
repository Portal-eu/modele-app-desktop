# Contrôles à chaque PR (et sur main) : version identique, tsc, cargo clippy, cargo test.
name: Contrôles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    name: tsc, clippy, test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - name: Version identique (package.json, tauri.conf.json, Cargo.toml)
        run: node scripts/verifier-version.mjs

      - name: Dépendances npm (package-lock.json)
        run: npm ci

      - name: tsc
        run: npx tsc

      # Tauri intègre l'interface compilée (dist/) au binaire : elle doit exister avant clippy.
      - name: Build de l'interface
        run: npx vite build

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
